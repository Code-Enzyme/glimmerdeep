apply plugin: 'com.android.application'

// Release builds (docs/RELEASE.md). The upload key and its passwords come from the environment (the release
// workflow's secrets) or from ~/.gradle/gradle.properties, never from the repo. Without them a release build
// is left unsigned: it still proves the release build works, but Google Play will not take it.
def setting = { String env, String prop -> System.getenv(env) ?: (project.findProperty(prop) ?: null) }
def uploadStore = setting('GLIMMERDEEP_UPLOAD_STORE', 'glimmerdeepUploadStore')
// Version code and name: 1 and "1.0" unless the release workflow passes its own (every upload to Google Play
// needs a higher code). Debug builds keep 1, so any debug build can update any other.
def versionCodeSetting = setting('GLIMMERDEEP_VERSION_CODE', 'glimmerdeepVersionCode')
def versionNameSetting = setting('GLIMMERDEEP_VERSION_NAME', 'glimmerdeepVersionName')

android {
    namespace = "com.codeenzyme.glimmerdeep"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.codeenzyme.glimmerdeep"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeSetting ? Integer.parseInt(versionCodeSetting.toString()) : 1
        versionName versionNameSetting ? versionNameSetting.toString() : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One debug key for every build (CI and laptops), committed on purpose: debug keys are not secret,
    // and a shared key lets any new debug build update the copy already on a phone.
    // tools/check-apk-key.sh checks it in CI. Release builds will use a separate upload key, never this one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadStore) {
            release {
                storeFile file(uploadStore.toString())
                storePassword setting('GLIMMERDEEP_UPLOAD_STORE_PASSWORD', 'glimmerdeepUploadStorePassword')
                keyAlias setting('GLIMMERDEEP_UPLOAD_KEY_ALIAS', 'glimmerdeepUploadKeyAlias') ?: 'upload'
                keyPassword setting('GLIMMERDEEP_UPLOAD_KEY_PASSWORD', 'glimmerdeepUploadKeyPassword')
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        // PLAY_STORE: release builds sell through Google Play Billing; debug builds use the game's free
        // test store (SPEC section 14), so a sideloaded debug build never needs a Play account.
        // Debug builds install as their own app, "Glimmerdeep Dev" (com.codeenzyme.glimmerdeep.debug), so a phone
        // can hold one beside the copy Google Play installs, which carries Google's signing key, not the debug key.
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "PLAY_STORE", "false"
        }
        release {
            if (uploadStore) signingConfig signingConfigs.release
            buildConfigField "boolean", "PLAY_STORE", "true"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.android.billingclient:billing:8.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
